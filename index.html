<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>FMS Escape Room - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 20px;
        }

        .start-screen {
            text-align: center;
        }

        .js-check {
            background: #f44336;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .js-working {
            background: #4caf50 !important;
        }

        .school-image {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .story {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            line-height: 1.6;
        }

        .start-options {
            margin-top: 30px;
        }

        .start-method {
            margin: 15px 0;
            padding: 20px;
            border: 3px solid #667eea;
            border-radius: 12px;
            cursor: pointer;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            transition: all 0.2s;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .start-method:active {
            transform: scale(0.95);
            background: #667eea;
            color: white;
        }

        .start-method.special {
            background: linear-gradient(135deg, #4caf50 0%, #66bb6a 100%);
            color: white;
            border-color: #4caf50;
            font-size: 1.2em;
        }

        .game-screen {
            display: none;
        }

        .game-screen.active {
            display: block;
        }

        .question-box {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .question {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .option {
            background: white;
            border: 3px solid #ddd;
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.05em;
        }

        .option:active {
            transform: scale(0.98);
        }

        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }

        .option.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        .feedback {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #4caf50;
        }

        .feedback.wrong {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f44336;
        }

        .next-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            display: none;
        }

        .next-btn.show {
            display: block;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .final-screen {
            display: none;
            text-align: center;
        }

        .final-screen.active {
            display: block;
        }

        .score-big {
            font-size: 3em;
            color: #667eea;
            margin: 30px 0;
        }
    
@media (max-width: 600px) {
  body { padding: 10px; font-size: 16px; }
  .start-method, button { font-size: 18px; padding: 14px; }
  fieldset { padding: 12px; }
  textarea { font-size: 16px; }
}

</style>
</head>

    <script>
        // Alle 30 Fragen
        var questions = [
            {

            {

            {

            {

            {

            {
                q: "Was ist ein wichtiges Aufnahmekriterium für die FMS?",

            {

            {

            },
            {
                q: "Was ist das Verhältnis von FMS- zu Gymnasium-Schülerinnen und -Schülern an der KSA?",
                opts: ["Ca. 1:4", "Ca. 1:5", "Ca. 1:6", "Ca. 1:7"],
                correct: 2,
                explain: "✓ Richtig! Mit 78 FMS-Schülern und etwa 506 Gymnasium-Schülern ist das Verhältnis etwa 1:6."
            },
            {
                q: "Welcher Prozentsatz der KSA-Schülerschaft ist in der FMS?",
                opts: ["Etwa 10%", "Etwa 14%", "Etwa 18%", "Etwa 22%"],
                correct: 1,
                explain: "✓ Richtig! 78 von 590 Schülern sind in der FMS, das sind etwa 14% der gesamten Schülerschaft."
            },
            {
                q: "Wozu berechtigt die Fachmaturität Pädagogik?",
                opts: ["Zugang zu allen Universitäten", "Prüfungsfreier Zugang zu Pädagogischen Hochschulen", "Nur zu bestimmten Fachhochschulen", "Direkter Berufseinstieg als Lehrer"],
                correct: 1,
                explain: "Die Fachmaturität Pädagogik ermöglicht den prüfungsfreien Zugang zu den Pädagogischen Hochschulen."
            },
            {
                q: "Was erhält man nach 3 Jahren FMS?",
                opts: ["Fachmaturität", "Fachmittelschulausweis", "Berufsmaturität", "Maturitätszeugnis"],
                correct: 1,
                explain: "Nach 3 Jahren erhält man den Fachmittelschulausweis, die Fachmaturität folgt nach einem weiteren Semester."
            },
            {
                q: "Wie viele Jahre dauert die FMS-Ausbildung inklusive Fachmaturität insgesamt?",
                opts: ["3 Jahre", "3,5 Jahre", "4 Jahre", "4,5 Jahre"],
                correct: 1,
                explain: "Die FMS-Ausbildung mit Fachmaturität dauert 3,5 Jahre: 3 Jahre für den Fachmittelschulausweis plus ein halbes Jahr (1 Semester) für die Fachmaturität."
            },
            {
                q: "Was ist ein Vorteil der FMS gegenüber dem Gymnasium?",
                opts: ["Kürzere Ausbildungsdauer", "Mehr Praxisbezug", "Höherer Abschluss", "Weniger Lektionen"],
                correct: 1,
                explain: "Die FMS bietet durch Praktika und berufsfeldbezogene Fächer mehr Praxisbezug als das Gymnasium."
            },
            {
                q: "Welche Kompetenzen werden in der FMS besonders gefördert?",
                opts: ["Nur fachliche Kompetenzen", "Selbst- und Sozialkompetenzen", "Nur Sprachkompetenzen", "Ausschließlich praktische Fertigkeiten"],
                correct: 1,
                explain: "In der FMS werden neben fachlichen Kompetenzen besonders auch Selbst- und Sozialkompetenzen gefördert."
            }
        ];

        var currentQ = 0;
        var score = 0;
        var answered = false;

        // Start-Funktion – nur Variante 1
        function startGame() {
            document.getElementById("startScreen").style.display = "none";
            document.getElementById("gameScreen").classList.add("active");
            loadQuestion();
        }
        document.getElementById("startBtn1").onclick = startGame;

        function loadQuestion() {
            answered = false;
            var q = questions[currentQ];
            
            document.getElementById('qNum').textContent = currentQ + 1;
            document.getElementById('question').textContent = q.q;
            
            var optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            for (var i = 0; i < q.opts.length; i++) {
                var div = document.createElement('div');
                div.className = 'option';
                div.textContent = q.opts[i];
                div.setAttribute('data-index', i);
                div.onclick = function() {
                    selectOption(parseInt(this.getAttribute('data-index')));
                };
                optionsDiv.appendChild(div);
            }
            
            document.getElementById('feedback').classList.remove('show');
            document.getElementById('nextBtn').classList.remove('show');
        }

        function selectOption(idx) {
            if (answered) return;
            answered = true;
            
            var q = questions[currentQ];
            var options = document.querySelectorAll('.option');
            var feedback = document.getElementById('feedback');
            
            if (idx === q.correct) {
                score++;
                options[idx].classList.add('correct');
                feedback.className = 'feedback correct show';
                feedback.innerHTML = '<strong>✓ Richtig!</strong> ' + q.explain;
            } else {
                options[idx].classList.add('wrong');
                options[q.correct].classList.add('correct');
                feedback.className = 'feedback wrong show';
                feedback.innerHTML = '<strong>✗ Falsch!</strong> ' + q.explain;
            }
            
            document.getElementById('score').textContent = score;
            document.getElementById('nextBtn').classList.add('show');
        }

        document.getElementById('nextBtn').onclick = function() {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showFinal();
            }
        };

        function showFinal() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('finalScreen').classList.add('active');
            
            document.getElementById('finalScore').textContent = score + ' / ' + questions.length;
            
            var percent = Math.round((score / questions.length) * 100);
            var msg = '';
            
            if (percent >= 90) {
                msg = '🏆 Hervorragend! Du bist ein FMS-Experte!';
            } else if (percent >= 70) {
                msg = '🎉 Sehr gut! Du kennst die FMS richtig gut!';
            } else if (percent >= 50) {
                msg = '👍 Gut gemacht!';
            } else {
                msg = '📚 Nicht schlecht! Es gibt noch einiges zu lernen.';
            }
            
            document.getElementById('finalMessage').textContent = msg;
        }

        document.getElementById('restartBtn').onclick = function() {
            currentQ = 0;
            score = 0;
            document.getElementById('finalScreen').classList.remove('active');
            document.getElementById('startScreen').style.display = 'block';
            document.getElementById('score').textContent = '0';
        };
    </script>
</body>
