<!doctype html>
<html lang="de-CH">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1717">
<title>FMS Escape Room · KSA</title>
<style>
:root{color-scheme:dark;--bg:#0b1717;--panel:#142424;--ink:#f4f6eb;--dim:#b7c9c1;--mint:#cffa86;--line:#344b44;--error:#ffc1b4;font-family:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 90% 5%,#213a2b,transparent 55%),var(--bg);min-height:100vh}
button{font:inherit;cursor:pointer}
button:focus-visible,video:focus-visible,h1:focus-visible,h2:focus-visible{outline:3px solid var(--mint);outline-offset:5px}
[hidden]{display:none!important}
.shell{width:min(100% - 40px,1080px);margin:auto}
.mast{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:24px 0;border-bottom:1px solid var(--line)}
.brand,.label,.caption,.stats,.letter{font:700 .75rem/1.4 ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:12px}
.badge{border:1px solid var(--mint);color:var(--mint);padding:7px 9px;border-radius:6px}
.label,.caption{color:var(--dim)}
main{padding:clamp(30px,6vw,76px) 0}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(24px,5vw,66px);align-items:center}
.eyebrow{color:var(--mint);margin:0 0 15px}
h1,h2,p{margin-top:0}
.hero h1{font-size:clamp(3.4rem,8.4vw,7.6rem);line-height:.86;letter-spacing:-.084em;margin-bottom:27px}
.hero h1 span{color:var(--mint);display:block}
.lead{font-size:clamp(1rem,2vw,1.22rem);line-height:1.6;color:var(--dim);max-width:38ch}
.primary{border:0;border-radius:9px;background:var(--mint);color:#142111;font-weight:800;min-height:48px;padding:13px 21px;transition:background .2s,transform .2s}
.primary:hover{background:#e0ffae;transform:translateY(-2px)}
.facts{display:flex;gap:clamp(16px,5vw,38px);margin:28px 0}
.facts strong{display:block;font-size:1.45rem;color:var(--ink)}
.media{margin:0;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#121f1e}
.video-stage{position:relative;background:linear-gradient(120deg,#263930,#152322);display:grid;place-items:center}
video{display:block;width:100%;height:clamp(255px,41vw,500px);object-fit:contain;background:#152322}
.caption{padding:13px 15px;display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line)}
.game,.result{max-width:760px;margin:auto}
.stats{display:flex;justify-content:space-between;gap:10px;color:var(--dim);margin-bottom:12px}
progress{display:block;width:100%;height:7px;border:0;border-radius:99px;overflow:hidden;background:#31433d;margin-bottom:22px}
progress::-webkit-progress-bar{background:#31433d}
progress::-webkit-progress-value{background:var(--mint);transition:width .25s}
progress::-moz-progress-bar{background:var(--mint)}
.card{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:clamp(18px,4vw,36px)}
h2{font-size:clamp(1.45rem,4vw,2.45rem);line-height:1.17;letter-spacing:-.035em;margin-bottom:23px}
.options{display:grid;gap:9px}
.option{display:flex;align-items:center;gap:13px;text-align:left;color:var(--ink);background:#192d2b;border:1px solid var(--line);border-radius:9px;min-height:51px;padding:9px 13px;transition:background .15s,border-color .15s}
.option:hover:not(:disabled){background:#254239;border-color:var(--mint)}
.option:disabled{cursor:default;opacity:1}
.letter{flex:none;color:var(--dim);border:1px solid var(--line);border-radius:5px;padding:4px 7px}
.option.correct{border-color:var(--mint);background:#283c27}
.option.wrong{border-color:var(--error);background:#3c2b2b}
.option.correct .letter{color:var(--mint)}
.option.wrong .letter{color:var(--error)}
.feedback{margin:17px 0 0;line-height:1.5;color:var(--dim)}
.feedback strong{color:var(--ink)}
.actions{display:flex;justify-content:flex-end;margin-top:18px}
.result .card{text-align:center}
.final-score{color:var(--mint);font-size:clamp(3rem,12vw,7rem);font-weight:800;letter-spacing:-.08em;line-height:1.05;margin:0 0 18px}
.result p:not(.label){color:var(--dim)}
.enter{animation:enter .3s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){.shell{width:calc(100% - 32px)}.mast{padding:16px 0}.hero{grid-template-columns:1fr}.hero h1{font-size:clamp(3.55rem,13vw,5.25rem)}.facts{margin:19px 0}.hero .primary{width:100%}video{height:300px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* The stairwell remains visible beside the access panel. */
:root{--ink:#fff3db;--dim:#c9baaa;--mint:#ffcc80;--line:#725540;--error:#ffada5}
body{isolation:isolate;background:#121013}
.scenery{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;--light:255,147,63;background:#151018}
body[data-zone="2"] .scenery{--light:97,182,255}
body[data-zone="3"] .scenery{--light:255,80,114}
.scenery video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;opacity:.69;filter:saturate(.7) contrast(1.12)}
.scenery::before,.scenery::after{content:"";position:absolute;inset:0}
.scenery::before{z-index:1;background:linear-gradient(90deg,rgba(14,9,16,.2),rgba(14,9,16,.52) 49%,rgba(14,9,16,.94) 100%),linear-gradient(0deg,#110d15 1%,transparent 55%,#110d15b0)}
.scenery::after{z-index:2;inset:-20%;background:radial-gradient(ellipse at 24% 46%,rgba(var(--light),.40),transparent 36%),repeating-linear-gradient(0deg,#1710191c 0 1px,transparent 1px 5px);animation:sweep 10s ease-in-out infinite alternate;transition:background .55s}
@keyframes sweep{from{transform:translateX(-5%);opacity:.62}to{transform:translateX(8%);opacity:1}}
body.motion-off .scenery::after{animation:none}
.mast{border-color:#edc59a56}
.badge{background:#221518}
.mast .label{text-shadow:0 1px 8px #000}
.hero>div{padding:20px 0;text-shadow:0 2px 24px #140d13}
.media,.video-stage,.media video{background:#1b1419}
.media{box-shadow:0 18px 50px #080509a6;border-color:#d49a655c}
.primary{background:var(--mint);color:#291809}
.primary:hover{background:#ffe1af}
.motion-control{background:#181118dd;color:var(--ink);border:1px solid #cd9d6a80;border-radius:5px;padding:7px 10px;font-size:.75rem;white-space:nowrap}
.motion-control:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.game,.result{max-width:690px;margin-left:auto;margin-right:0}
.card{position:relative;background:linear-gradient(145deg,#261b20f7,#18141bef);border:1px solid #9f775c;border-radius:5px;box-shadow:0 24px 70px #100810c0,inset 0 0 34px #08070d7a}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;pointer-events:none}
.card::before{top:-1px;left:-1px;border-top:2px solid var(--mint);border-left:2px solid var(--mint)}
.card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--mint);border-right:2px solid var(--mint)}
h2:focus{outline:none}
.stats{color:var(--ink);text-shadow:0 1px 7px #000}
progress,progress::-webkit-progress-bar{background:#231722}
.option{background:linear-gradient(105deg,#39282b,#221d25);border-color:#9c78546e;border-radius:4px}
.option:hover:not(:disabled){background:#513631;border-color:var(--mint)}
.letter{border-color:#a27950;background:#21151a;border-radius:2px;color:var(--mint)}
.option.correct{background:#293923;border-color:#d0ed9a}
.option.correct .letter{color:#d0ed9a}
.option.wrong{background:#49242b}
.zone{display:flex;align-items:center;gap:9px}
.zone::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
@media(max-width:640px){.scenery::before{background:linear-gradient(0deg,#110d15 0%,#110d1560 65%,#110d15c0)}.mast .brand{font-size:.64rem;gap:7px}.mast>.label{display:none}.hero>div{padding:0}.game,.result{margin:auto}}
@media(prefers-reduced-motion:reduce){.scenery::after{animation:none!important}}

</style>

const get = id => document.getElementById(id);
const target = 21;
let current = 0;
let score = 0;
let answered = false;
const sceneryVideo = get('sceneryVideo');
const motionControl = get('motionControl');
const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
let motionPaused = motionPreference.matches;
sceneryVideo.poster = get('tour').poster;

function updateMotion() {
  document.body.classList.toggle('motion-off', motionPaused);
  motionControl.setAttribute('aria-pressed', String(motionPaused));
  motionControl.textContent = motionPaused ? 'Hintergrund bewegen' : 'Hintergrund pausieren';
  if (motionPaused) {
    sceneryVideo.pause();
    return;
  }
  if (!sceneryVideo.getAttribute('src')) {
    sceneryVideo.src = get('tour').querySelector('source').src;
  }
  sceneryVideo.play().catch(() => {});
}

motionControl.addEventListener('click', () => {
  motionPaused = !motionPaused;
  updateMotion();
});
motionPreference.addEventListener('change', event => {
  motionPaused = event.matches;
  updateMotion();
});
get('tour').addEventListener('play', () => sceneryVideo.pause());
get('tour').addEventListener('pause', updateMotion);
get('tour').addEventListener('ended', updateMotion);
updateMotion();

function startGame() {
  get('tour').pause();
  current = 0;
  score = 0;
  get('start').hidden = true;
  get('result').hidden = true;
  get('game').hidden = false;
  get('progress').max = questions.length;
  showQuestion();
}

function updateStats() {
  const zone = Math.min(3, Math.floor(current / 10) + 1);
  document.body.dataset.zone = zone;
  get('position').textContent = 'Sektor ' + zone + ' · Frage ' + (current + 1) + ' / ' + questions.length;
  get('score').textContent = 'Richtig: ' + score + ' / ' + target;
  get('progress').value = current + Number(answered);
}

function showQuestion() {
  answered = false;
  const entry = questions[current];
  get('question').textContent = entry.q;
  get('feedback').replaceChildren();
  get('actions').hidden = true;
  const options = get('options');
  options.replaceChildren();
  entry.opts.forEach((option, index) => {
    const button = document.createElement('button');
    button.className = 'option';
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.setAttribute('aria-hidden', 'true');
    letter.textContent = 'ABCD'[index];
    button.append(letter, document.createTextNode(option));
    button.addEventListener('click', () => answerQuestion(index));
    options.append(button);
  });
  updateStats();
  const card = get('questionCard');
  card.classList.remove('enter');
  requestAnimationFrame(() => card.classList.add('enter'));
  get('question').focus();
}

function answerQuestion(index) {
  if (answered) return;
  answered = true;
  const entry = questions[current];
  const correct = index === entry.correct;
  if (correct) score++;
  const buttons = get('options').children;
  for (const button of buttons) button.disabled = true;
  buttons[entry.correct].classList.add('correct');
  if (!correct) buttons[index].classList.add('wrong');
  const verdict = document.createElement('strong');
  verdict.textContent = correct ? 'Richtig. ' : 'Richtig ist: ' + entry.opts[entry.correct] + '. ';
  const explanation = entry.explain.replace(/^(?:✓\s*)?Richtig!\s*/, '');
  get('feedback').replaceChildren(verdict, document.createTextNode(explanation));
  updateStats();
  get('next').textContent = current + 1 === questions.length ? 'Ergebnis anzeigen →' : 'Weiter →';
  get('actions').hidden = false;
  get('next').focus();
}

function nextQuestion() {
  if (!answered) return;
  current++;
  if (current < questions.length) {
    showQuestion();
    return;
  }
  const escaped = score >= target;
  get('game').hidden = true;
  get('result').hidden = false;
  get('resultTitle').textContent = escaped ? 'Der Ausgang ist offen!' : 'Der Ausgang bleibt verschlossen';
  get('finalScore').textContent = score + ' / ' + questions.length;
  get('resultMessage').textContent = escaped ? 'Du hast die Mission geschafft.' : 'Mit 21 richtigen Antworten öffnest du den Ausgang.';
  get('resultTitle').focus();
}

get('startButton').addEventListener('click', startGame);
get('next').addEventListener('click', nextQuestion);
get('restart').addEventListener('click', startGame);
